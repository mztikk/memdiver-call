name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps
      - name: Package contents
        run: |
          cargo package --list -p memdiver-call
          cargo package --list -p memdiver-call-sys

  windows:
    name: Windows ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Tests
        run: cargo test --workspace --target ${{ matrix.target }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

  windows-wine:
    name: Windows cross-tests (Wine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu, i686-pc-windows-gnu
          components: clippy
      - name: Install MinGW and Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 wine wine64 wine32:i386
      - name: Cross-check x86_64
        run: cargo check --workspace --all-targets --target x86_64-pc-windows-gnu
      - name: Cross-clippy x86_64
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - name: Cross-check x86
        run: cargo check --workspace --all-targets --target i686-pc-windows-gnu
      - name: Cross-clippy x86
        run: cargo clippy --workspace --all-targets --target i686-pc-windows-gnu -- -D warnings
      - name: Test x86_64 under Wine
        env:
          WINEPREFIX: ${{ github.workspace }}/.wine-x64
          WINEDEBUG: "-all"
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUNNER: wine
        run: cargo test --workspace --target x86_64-pc-windows-gnu
      - name: Test x86 under Wine
        env:
          WINEPREFIX: ${{ github.workspace }}/.wine-wow64
          WINEDEBUG: "-all"
          CARGO_TARGET_I686_PC_WINDOWS_GNU_RUNNER: wine
        run: cargo test --workspace --target i686-pc-windows-gnu

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-targets
